name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Git ref to build (use a version tag when publishing)
        required: true
        default: v0.1.5
      publish:
        description: Publish installers after all checks pass
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            directory: mac-arm64
          - runner: macos-15-intel
            arch: x64
            directory: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AI_OLD_REQUIRE_NOTARIZATION: ${{ vars.AI_OLD_REQUIRE_NOTARIZATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: npm run desktop:mac -- --${{ matrix.arch }}
      - name: Launch the packaged app and exercise renderer IPC
        run: npm run test:desktop
        env:
          AI_OLD_TEST_EXECUTABLE: ${{ github.workspace }}/release/${{ matrix.directory }}/AI for the old.app/Contents/MacOS/AI for the old
      - name: Verify architecture and code signature
        run: |
          lipo -archs 'release/${{ matrix.directory }}/AI for the old.app/Contents/MacOS/AI for the old'
          codesign --verify --deep --strict 'release/${{ matrix.directory }}/AI for the old.app'
      - name: Verify notarization when configured
        if: env.APPLE_ID != ''
        run: |
          xcrun stapler validate 'release/${{ matrix.directory }}/AI for the old.app'
          spctl --assess --type execute --verbose 'release/${{ matrix.directory }}/AI for the old.app'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-installer
          path: release/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run desktop:win -- --x64
      - name: Launch the packaged Windows app
        run: npm run test:desktop
        env:
          AI_OLD_TEST_EXECUTABLE: ${{ github.workspace }}/release/win-unpacked/AI for the old.exe
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Record checksums
        working-directory: release-assets
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Publish verified installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
